# Pinned build tools; `make setup` runs `mise install`. Rust itself is pinned by rust-toolchain.toml (rustup).
[tools]
bun = "1.3.9"
"github:wasm-bindgen/wasm-pack" = "0.15.1"
"github:WebAssembly/binaryen" = "version_133"
# `make coverage` runs `cargo llvm-cov`; a prebuilt release, so CI needs no `cargo install`.
"github:taiki-e/cargo-llvm-cov" = "0.9.1"
node = "26.11.1"
