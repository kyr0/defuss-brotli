[package]
name = "defuss_brotli_decompressor"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "WASM wrapper around the pure-Rust brotli decoder."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
brotli-decompressor = { version = "5.0.0", default-features = false }
wasm-bindgen = { version = "0.2.114", default-features = false }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
brotli = "8.0.2"
